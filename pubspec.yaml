name: asset_doctor
description: Clean up unused assets and optimize the ones you use. Handles images, audio, video, json, fonts, xml, yaml, text and frag files.
version: 1.0.0
repository: https://github.com/andy-ife/asset_doctor

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.7.0
  path: ^1.9.1

  # Image
  image_compression: ^1.0.5

  collection: ^1.19.1

  # TODO: Implement custom multi select list and remove this dependency
  # We are using it ONLY for the multi select list
  # Everything else the package comes with is not useful to this project and causes bloat
  interact_cli: ^2.4.0
  ffi: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
